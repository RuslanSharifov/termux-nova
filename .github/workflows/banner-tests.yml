name: Banner renderer tests
on:
  push:
    paths:
      - 'nova.sh'
      - 'install.sh'
      - 'windows/nova.ps1'
      - 'windows/install.ps1'
      - 'assets/banner-font.txt'
      - 'tests/test_banner.sh'
      - '.github/workflows/banner-tests.yml'
  pull_request:
jobs:
  banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n nova.sh && bash -n install.sh
      - name: Banner behavior and glyph coverage
        run: bash tests/test_banner.sh
      - name: Windows PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('windows/nova.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Windows banner behavior in PowerShell
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'nova-app'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'nova-local'
          $app = Join-Path $env:APPDATA 'termux-nova'
          $cache = Join-Path $env:LOCALAPPDATA 'termux-nova/cache'
          New-Item -ItemType Directory -Force $app, $cache | Out-Null
          Copy-Item assets/banner-font.txt (Join-Path $app 'banner-font.txt')
          Set-Content (Join-Path $cache 'repo.json') -Value '{}'
          & ./windows/nova.ps1 banner set 'RUSLAN 2026!'
          $conf = Get-Content (Join-Path $app 'config') -Raw
          if ($conf -notmatch 'BANNER_TEXT=RUSLAN 2026!') { throw 'Banner text not saved' }
          & ./windows/nova.ps1 banner set 'A&B|C/#? 123'
          $conf = Get-Content (Join-Path $app 'config') -Raw
          if ($conf -notmatch 'BANNER_TEXT=A&B\|C/#\? 123') { throw 'Punctuation not saved' }
          & ./windows/nova.ps1 banner reset
          $conf = Get-Content (Join-Path $app 'config') -Raw
          if ($conf -notmatch 'BANNER_TEXT=NOVA') { throw 'Banner reset failed' }

  windows-cls:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native CMD clear and banner hook
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'nova-cmd-app'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'nova-cmd-local'
          $app = Join-Path $env:APPDATA 'termux-nova'
          $cache = Join-Path $env:LOCALAPPDATA 'termux-nova/cache'
          New-Item -ItemType Directory -Force -Path $app, $cache | Out-Null
          Copy-Item windows/nova.ps1 (Join-Path $app 'nova.ps1')
          Copy-Item windows/themes.json (Join-Path $app 'themes.json')
          Copy-Item assets/banner-font.txt (Join-Path $app 'banner-font.txt')
          Set-Content (Join-Path $cache 'repo.json') -Value '{}'
          $nova = Join-Path $app 'nova.ps1'
          & $nova hook | Out-Null
          $macro = (Get-Content (Join-Path $app 'macros.txt') | Where-Object { $_ -like 'cls=*' })
          if ($macro.Count -ne 1) { throw "Expected exactly one cls macro: $macro" }
          if ($macro -notmatch 'cls=powershell .*clearhook$') { throw "Unexpected cls macro: $macro" }
          if ($macro -match 'cls=cls') { throw 'Old two-command cls macro remains' }
          & $nova banner set 'BANNER TEST' | Out-Null
          & $nova clearhook
          if (-not $?) { throw 'clearhook failed with banner enabled' }
          & $nova banner reset | Out-Null
          $config = Join-Path $app 'config'
          Add-Content -Path $config -Value 'BANNER_ON_CLEAR=off'
          & $nova clearhook
          if (-not $?) { throw 'clearhook failed with banner disabled' }
